name: shorts-runner

# Что делает: раз в 15 минут пинает хостинг (создать выпуск, обработать очередь, прочитать команды Telegram)
# и, если есть готовое задание, собирает видео FFmpeg и отправляет его обратно на хостинг.
# Для ПРИВАТНОГО репозитория бесплатных минут ограниченное количество: поставьте cron реже, например '7 * * * *'.
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

concurrency:
  group: shorts-runner
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      SHORTS_HOST_URL: ${{ secrets.SHORTS_HOST_URL }}
      SHORTS_TOKEN: ${{ secrets.SHORTS_TOKEN }}
      # У хостинга самоподписанный сертификат (GitHub писал: curl 60). Уберите эту строку, когда на сайте будет нормальный SSL.
      SHORTS_INSECURE_TLS: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Пинок хостингу и проверка заданий (без установки программ)
        id: probe
        run: |
          set -e
          K=""; [ "$SHORTS_INSECURE_TLS" = "1" ] && K="-k"
          for i in 1 2 3 4 5 6; do
            # tick - это "пинок" хостингу. Если хостинг занят долгой задачей, nginx может ответить 504: это не страшно, идём дальше.
            if ! out=$(curl -sS $K --max-time 150 -H "X-Shorts-Token: $SHORTS_TOKEN" "$SHORTS_HOST_URL?action=tick"); then
              echo "::warning::tick: нет ответа от хостинга (см. ошибку curl выше)"; break
            fi
            echo "$out" | head -c 600; echo
            echo "$out" | jq -e . >/dev/null 2>&1 || { echo "::warning::tick ответил не JSON (хостинг занят или 504). Продолжаю."; break; }
            n=$(echo "$out" | jq -r '.result.worker.processed // 0')
            [ "$n" -gt 0 ] || break
          done
          # А вот без render_peek работать нельзя: ошибка тут - неверный адрес/токен или недоступен хостинг.
          peek=$(curl -sS $K --max-time 90 -H "X-Shorts-Token: $SHORTS_TOKEN" "$SHORTS_HOST_URL?action=render_peek") || { echo "::error::Хостинг недоступен для GitHub (см. ошибку curl выше)"; exit 1; }
          echo "render_peek ответ: $(echo "$peek" | head -c 300)"
          echo "$peek" | jq -e . >/dev/null 2>&1 || { echo "::error::render_peek ответил не JSON: неверный SHORTS_HOST_URL/SHORTS_TOKEN или хостинг занят (504). Запустите ещё раз."; exit 1; }
          job=$(echo "$peek" | jq -r 'if .job == true then "yes" else "no" end')
          echo "render_peek: has_job=$job"
          echo "has_job=$job" >> "$GITHUB_OUTPUT"
      - name: Установка PHP и FFmpeg (только если есть задание)
        if: steps.probe.outputs.has_job == 'yes'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq php-cli php-curl php-mbstring ffmpeg fonts-dejavu-core
      - name: Сборка видео
        if: steps.probe.outputs.has_job == 'yes'
        run: php runner/run.php
